# E2E configuration for the usage-collector gear.
#
# Used only by `make e2e-usage-collector` (alias for `make e2e-local
# GEAR=usage-collector`), which builds a dedicated binary and starts a
# TimescaleDB container. NOT part of config/e2e-features.txt or the shared
# `make e2e-local` run. Colocated with the suite (its conftest loads it) rather
# than living under config/.
#
# There is one authz surface left. `usage_type` was a second `ResourceType`
# with no supported properties, running under `require_constraints(false)`; the
# types-registry redesign deleted the catalog routes it guarded and the gear now
# declares only `usage_record` (`domain/authz.rs`, `RESOURCE`). That one lists
# `owner_tenant_id` among its supported properties and every record route runs
# under `require_constraints(true)`, so `static-authz-plugin` emits the row
# clamp the tenant-scoping tests assert against.
#
# `__E2E_TS_PORT__` is substituted with the container's mapped host port by
# testing/e2e/suites/usage_collector/conftest.py before the server starts.
#
# usage-collector itself now declares the `db` capability, for the DESIGN
# §3.7 declaration mirror (cpt-cf-usage-collector-adr-declaration-rehydration)
# — one small, temporary table the gear uses to restore a lost GTS type
# declaration; see its `database:` block below, on the same `sqlite_uc_e2e`
# server as credstore/resource-group/simple-user-settings. Every durable
# usage row still lives wholly in the bound storage plugin's own TimescaleDB,
# via `database_url` below — the mirror never holds a usage record, only a
# cached type declaration — and types-registry is in-memory. A top-level
# `database:` section was already required regardless of this gear's own
# binding: `credstore`, `resource-group`, `simple-user-settings`, and
# `file-parser` are gears compiled unconditionally into
# cf-gears-example-server (not gated by any cargo feature — see
# apps/cf-gears-example-server/Cargo.toml) and the first three call
# `ctx.db_required()` at init. Verified by hand: booting this binary with NO
# `database:` section (mirroring config/no-db.yaml) fails identically with
# "Database is not configured for gear 'credstore'" before api-gateway ever
# starts — config/no-db.yaml itself only works with the `check` subcommand
# (a config-parse no-op), never with `run`, so that pattern does not
# transfer here. A local SQLite server is used for these gears; it is
# completely independent of the TimescaleDB plugin's own Postgres pool.
database:
  servers:
    sqlite_uc_e2e:
      engine: "sqlite"
      params:
        WAL: "true"
      pool:
        max_conns: 5

server:
  home_dir: "~/.cf-gears"

logging:
  default:
    console_level: info
    file: "logs/cf-gears-e2e-usage-collector.log"
    file_level: debug
    max_age_days: 7
    max_backups: 3
    max_size_mb: 50
  sqlx:
    console_level: warn
    file: "logs/sql-usage-collector.log"
    file_level: debug

gears:
  api-gateway:
    config:
      bind_addr: "127.0.0.1:8088"
      enable_docs: true
      cors_enabled: false
      auth_disabled: false
      require_auth_by_default: true
      openapi:
        title: "CF/Gears Usage Collector E2E"
        version: "0.1.0"
        description: "Usage Collector E2E server"
      defaults:
        body_limit_bytes: 64000000

  grpc-hub:
    config:
      listen_addr: "uds:///tmp/cf-gears-grpc-uc-e2e"

  types-registry:
    config: {}

  tenant-resolver:
    config:
      vendor: "constructorfabric"

  # Single-root tree (static-tr-plugin enforces exactly one root). Tenants A
  # and B are SIBLINGS, so neither is an ancestor of the other and the PDP's
  # own-tenant clamp genuinely isolates them.
  static-tr-plugin:
    config:
      vendor: "constructorfabric"
      priority: 20
      tenants:
        - id: "a0000000-0000-4000-8000-000000000000"
          name: "e2e-uc-root"
          parent_id: null
          status: active
        - id: "a0000000-0000-4000-8000-00000000000a"
          name: "e2e-uc-tenant-a"
          parent_id: "a0000000-0000-4000-8000-000000000000"
          status: active
        - id: "a0000000-0000-4000-8000-00000000000b"
          name: "e2e-uc-tenant-b"
          parent_id: "a0000000-0000-4000-8000-000000000000"
          status: active

  authn-resolver:
    config:
      vendor: "constructorfabric"

  static-authn-plugin:
    config:
      vendor: "constructorfabric"
      priority: 100
      mode: static_tokens
      tokens:
        - token: "e2e-uc-token-tenant-a"
          identity:
            subject_id: "a0000000-0000-4000-8000-0000000000a1"
            subject_tenant_id: "a0000000-0000-4000-8000-00000000000a"
            subject_type: "gts.cf.core.security.subject_user.v1~"
            token_scopes: ["*"]
        - token: "e2e-uc-token-tenant-b"
          identity:
            subject_id: "a0000000-0000-4000-8000-0000000000b1"
            subject_tenant_id: "a0000000-0000-4000-8000-00000000000b"
            subject_type: "gts.cf.core.security.subject_user.v1~"
            token_scopes: ["*"]

  authz-resolver:
    config:
      vendor: "constructorfabric"

  # credstore, resource-group, and simple-user-settings are mandatory gears
  # (not gated by any cargo feature) that require a database at init; see the
  # top-of-file note. No credstore storage plugin is bound here since this
  # e2e suite never exercises credstore's endpoints.
  credstore:
    database:
      server: "sqlite_uc_e2e"
      file: "credstore.db"
    config:
      vendor: "constructorfabric"

  resource-group:
    database:
      server: "sqlite_uc_e2e"
      file: "resource_group.db"
    config: {}

  simple-user-settings:
    database:
      server: "sqlite_uc_e2e"
      file: "settings.db"
    config: {}

  # file-parser is also a mandatory gear; `allowed_local_base_dir` has no
  # default.
  file-parser:
    config:
      allowed_local_base_dir: /tmp

  static-authz-plugin:
    config:
      vendor: "constructorfabric"
      priority: 100

  # `vendor` is written out explicitly on BOTH the gear and the plugin. They
  # happen to share the same crate default today (`constructorfabric`); stating it
  # means a future default change in either crate cannot silently leave the
  # gear with no storage plugin bound — a failure that would otherwise surface
  # only on the first dispatch, not at startup.
  usage-collector:
    database:
      server: "sqlite_uc_e2e"
      file: "usage_collector_declaration_mirror.db"
    config:
      vendor: "constructorfabric"
      # Deliberately tiny, and the only reason the declaration mirror's
      # `ON CONFLICT DO UPDATE` branch is reachable from this suite at all.
      # That branch needs ONE meter resolved TWICE with a cache miss in
      # between, and the resolver has exactly two ways to miss on a key it
      # already holds: the TTL expiring (`type_cache_ttl_secs`, default 300s
      # — unwaitable under pytest.ini's 10s per-test budget) and the
      # least-recently-resolved eviction in `TypeResolver::store` (default
      # ceiling 10000 — unfillable in a test). Lowering the ceiling makes the
      # SECOND one drivable: `test_declaration_mirror.py` resolves this many
      # other meters and its own is gone. The branch is then exercised by the
      # gear's real eviction path, not by a test hook.
      #
      # It costs this suite nothing it was covering. Every test here declares
      # exactly one meter and never revisits another test's, so a two-entry
      # cache still serves every within-test repeat from cache and no test
      # re-resolves a meter it did not mean to. What is NOT covered here, and
      # was not before either, is a large cache's steady state — the
      # resolver's own unit tests (`domain/type_resolver/resolver_tests.rs`)
      # own capacity and eviction behaviour.
      #
      # Read back by conftest.py as TYPE_CACHE_CAPACITY; the test derives its
      # filler count from it rather than restating the number.
      type_cache_capacity: 2

  timescaledb-usage-collector-plugin:
    config:
      vendor: "constructorfabric"
      priority: 10
      # sslmode=disable is the deliberate opt-out build_pool honours; the test
      # container serves no TLS, and a DSN with no explicit sslmode is upgraded
      # to `require`.
      database_url: "postgres://uc:uc@127.0.0.1:__E2E_TS_PORT__/uc?sslmode=disable"
      pool_size_min: 2
      pool_size_max: 16
      connection_timeout_secs: 10
      statement_timeout_secs: 30
