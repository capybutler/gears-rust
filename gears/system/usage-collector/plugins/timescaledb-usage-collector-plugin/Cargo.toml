[package]
name = "cf-gears-timescaledb-usage-collector-plugin"
description = "TimescaleDB Usage Collector storage backend plugin"
version = "0.2.1"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["constructorfabric", "cf-gears"]
metadata.docs.rs.all-features = true

[lib]
name = "timescaledb_usage_collector_plugin"

[lints]
workspace = true

[features]
# Gates the TimescaleDB-backed real-DB integration tests (Docker required).
postgres = []

[dependencies]
usage-collector-sdk = { workspace = true }
types-registry-sdk = { workspace = true }
types-registry = { workspace = true }

toolkit = { workspace = true }
toolkit-macros = { workspace = true }
toolkit-odata = { workspace = true }

tokio-util = { workspace = true }

async-trait = { workspace = true }

# ISO 8601 duration parsing for the declared `retention` trait.
toolkit-utils = { workspace = true }

sqlx = { workspace = true, features = [
  "postgres",
  "uuid",
  "time",
  "rust_decimal",
  "bigdecimal",
  "json",
  "migrate",
  "macros",
] }

# ODataValue carries these types; converted to time/rust_decimal at the bind layer.
bigdecimal = { workspace = true }
chrono = { workspace = true }

rust_decimal = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }

# Full-jitter on the create_batch transient-error backoff (decorrelates
# concurrent deadlock-victim retries).
rand = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }

secrecy = { workspace = true }

opentelemetry = { workspace = true }
tracing = { workspace = true }

anyhow = { workspace = true }

# Required by the toolkit::gear macro
inventory = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
# The DESIGN section 3.3 plugin contract suite, run by
# `tests/contract_conformance_pg.rs`. Keyed by the workspace alias, not the
# package name. `[dependencies]` above already names it `usage-collector-sdk`,
# and a second key for one package is a second dependency; the workspace table
# supplies the `package = "cf-gears-usage-collector-sdk"` rename. Matches how
# `postgres-cluster-plugin` enables a feature on its own aliased workspace
# dependency: `cluster-sdk = { workspace = true, features = ["otel"] }`.
usage-collector-sdk = { workspace = true, features = ["contract"] }
# Unconditional: [dev-dependencies] can't be optional; usage is #![cfg(feature="postgres")]-gated.
testcontainers = { workspace = true }
test-containers = { workspace = true }
# In-memory metric reader for the metrics-recording unit tests; the `testing`
# feature gates `InMemoryMetricExporter`.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
# `MockTypesRegistryClient` for the retention-source unit tests.
types-registry-sdk = { workspace = true, features = ["test-util"] }
