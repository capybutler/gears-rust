[package]
name = "cf-gears-usage-collector"
description = "usage-collector gateway module"
version = "0.4.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["constructorfabric", "cf-gears"]
categories = ["api-bindings"]
metadata.docs.rs.all-features = true

[lib]
name = "usage_collector"

[lints]
workspace = true

[features]
# Serve generation 2 alongside generation 1. Non-default: it gates the
# link-time GTS content (the cf.core.uc.usage_record.v2~ base type and six
# permissions) and the bootstrap that joins the surface to the gear, so a
# generation-1 deployment publishes nothing it does not serve. Every other
# line of src/v2 compiles unconditionally, so a default-feature test run
# covers the domain, infra and API layers.
v2 = []

[dependencies]
usage-collector-sdk = { workspace = true }
types-registry-sdk = { workspace = true }
types-registry = { workspace = true }
authz-resolver-sdk = { workspace = true }
authz-resolver = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
axum = { workspace = true, features = ["macros"] }
utoipa = { workspace = true, features = ["time", "decimal"] }
rust_decimal = { workspace = true }
bigdecimal = { workspace = true }

# Operational metrics: instruments are declared on a scoped `Meter` from
# ToolKit's global `SdkMeterProvider` (OTLP push; no gear-local exporter or
# `/metrics` scrape endpoint) per
# `cpt-cf-usage-collector-principle-otlp-push-emission`.
opentelemetry = { workspace = true }

toolkit = { workspace = true }
toolkit-odata = { workspace = true, features = ["with-utoipa"] }
toolkit-security = { workspace = true }
toolkit-macros = { workspace = true }
toolkit-canonical-errors = { workspace = true }
# Link-time GTS permission catalog (`src/gts/permissions.rs`): declares
# AuthzPermissionV1 instances into the toolkit-gts inventory that
# types-registry aggregates at boot.
toolkit-gts = { workspace = true }
# Direct dep needed because `gts_instance!` expansions reference
# `::gts::*` paths (the compile-time `<S as GtsSchema>::SCHEMA_ID` prefix
# asserts). Without this the proc-macro emits `::gts::…` identifiers that
# cannot be resolved.
gts = { workspace = true }
inventory = { workspace = true }

# The Feed Gateway's own position encoding inside `toolkit_odata::CursorV1`'s
# `k` field.
base64 = { workspace = true }
# FNV-1a 64-bit for the gear's cursor fingerprint (`v2::domain::fingerprint`).
fnv = { workspace = true }
# Compiles a meter's declared `metadata` subschema once per declaration
# (`v2::domain::type_resolver::metadata`).
jsonschema = { workspace = true }
# Non-poisoning locks for in-memory state. See guidelines/DEPENDENCIES.md.
parking_lot = { workspace = true }
# GTS schema and permission registration.
schemars = { workspace = true }
# The declaration mirror's table. See ADR-0015.
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
toolkit-db = { workspace = true, features = ["sqlite", "pg"] }
toolkit-db-macros = { workspace = true }

[dev-dependencies]
types-registry-sdk = { workspace = true, features = ["test-util"] }
# `test-util` enables `#[tokio::test(start_paused = true)]` so the bounded
# gauge-refresh timeout can be exercised without a wall-clock delay.
tokio = { workspace = true, features = ["test-util"] }
# In-memory metric exporter + `SdkMeterProvider` for asserting emitted
# instrument names / labels / buckets against DESIGN §3.11.5. Test-only —
# the gear never constructs an exporter at runtime (ToolKit owns it).
opentelemetry_sdk = { workspace = true, features = ["testing"] }
toolkit-gts = { workspace = true }
# Test-only: parses `docs/usage-collector-v2.yaml` for the OpenAPI
# contract conformance test.
serde-saphyr = { workspace = true }
# Test-only: `ServiceExt::oneshot` drives one request through the assembled
# `Router` so `register_routes`' `Extension<Arc<Service>>` layer — invisible
# to the OpenAPI registry — is pinned by dispatch.
tower = { workspace = true }
# Test-only: capturing tracing subscriber for the v2 observability and
# service-metrics span/log assertions.
tracing-subscriber = { workspace = true }
# Test-only: trace-context propagation helper
# (`toolkit_http::otel::set_parent_from_headers`) exercised by the v2
# observability tests.
toolkit-http = { workspace = true }
# Real-Postgres coverage for the declaration mirror
# (tests/postgres_declaration_mirror.rs).
testcontainers-modules = { workspace = true }
# Pinned Postgres test image (`test_containers::postgres()`); `xtask pins`
# refuses a raw image string here.
test-containers = { workspace = true }
