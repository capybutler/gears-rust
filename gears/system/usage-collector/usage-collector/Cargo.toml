[package]
name = "cf-gears-usage-collector"
description = "usage-collector gateway module"
version = "0.4.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["constructorfabric", "cf-gears"]
categories = ["api-bindings"]
metadata.docs.rs.all-features = true

[lib]
name = "usage_collector"

[lints]
workspace = true

[dependencies]
usage-collector-sdk = { workspace = true }
types-registry-sdk = { workspace = true }
types-registry = { workspace = true }
authz-resolver-sdk = { workspace = true }
authz-resolver = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
# The Feed Gateway's own position encoding inside `CursorV1::k` (ruling E9):
# `toolkit_odata`'s matching alphabet lives in a private `mod base64_url`, so
# this gear carries its own `URL_SAFE_NO_PAD` engine rather than reaching
# into that module.
base64 = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Compiles a meter's declared `metadata` subschema once per declaration and
# validates entries against it (`domain::type_resolver::metadata`). Already a
# workspace dependency shared by five other gears.
jsonschema = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
axum = { workspace = true, features = ["macros"] }
utoipa = { workspace = true, features = ["time", "decimal"] }
rust_decimal = { workspace = true }
bigdecimal = { workspace = true }

# Operational metrics: instruments are declared on a scoped `Meter` from
# ToolKit's global `SdkMeterProvider` (OTLP push; no gear-local exporter or
# `/metrics` scrape endpoint) per
# `cpt-cf-usage-collector-principle-otlp-push-emission`.
opentelemetry = { workspace = true }

toolkit = { workspace = true }
toolkit-odata = { workspace = true, features = ["with-utoipa"] }
toolkit-security = { workspace = true }
toolkit-macros = { workspace = true }
toolkit-canonical-errors = { workspace = true }
# GTS schema and permission registration. See DESIGN §3.2/§3.7.
toolkit-gts = { workspace = true }
gts = { workspace = true }
inventory = { workspace = true }
schemars = { workspace = true }

# Temporary declaration mirror DB. See ADR-0015.
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
toolkit-db = { workspace = true, features = ["sqlite", "pg"] }
toolkit-db-macros = { workspace = true }

[dev-dependencies]
types-registry-sdk = { workspace = true, features = ["test-util"] }
# Paused-time tests.
tokio = { workspace = true, features = ["test-util"] }
# In-memory metric assertions.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
toolkit-gts = { workspace = true }
# OpenAPI YAML contract tests.
serde-saphyr = { workspace = true }
# Router `oneshot` tests.
tower = { workspace = true }
# Capturing tracing subscriber tests.
tracing-subscriber = { workspace = true }
# Trace-context test helper.
toolkit-http = { workspace = true }
# Postgres declaration-mirror integration tests.
testcontainers-modules = { workspace = true }
# Pinned Postgres test image.
test-containers = { workspace = true }
